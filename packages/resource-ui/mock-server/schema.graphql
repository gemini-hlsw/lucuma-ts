#import BigDecimal, Date, Long, NonEmptyString, Partner, PosInt, ProgramReferenceLabel, Semester, Site, TimeSpan, Timestamp, TimestampInterval from "@gemini-hlsw/lucuma-odb-schemas/odb"
#
# The import has to be the first thing in the file: @graphql-tools' file loader
# only looks for imports when the SDL *starts* with one, so a header comment
# above it silently turns every type below into an unknown type. What is
# imported and why is explained under "Types shared with the ODB".

# Resource v1 - preview schema
#
# The queryable record of what the observatory can do, at each site, over any
# interval of time. Not a scheduler, and not a tool for building a schedule.
#
# FOR REVIEW (Bryan, Andrew). This is the API design, deliberately circulated as
# SDL before any resolver exists - it is cheaper to change here than in code.
# Questions still open with operations are recorded in CLAUDE.md, not here.
#
# Two consumers: the scheduler (telescopeNights, pull-only) and the Resource
# frontend (the same query, regrouped per view).
#
# Design rules this schema is held to:
#   - Intervals, never dates. Every fact carries [start, end), start inclusive and
#     end exclusive, so a fact that covers part of a night needs no special case.
#   - A gap means "not recorded", never "unavailable". Absence is never a state.
#   - Two records for the same subject never overlap.
#   - No type here without a requirement behind it: a row in the published sheet,
#     a line in the scheduler contract, or a request from operations.

# ---------------------------------------------------------------------------
# Types shared with the ODB
#
# Taken from the published ODB schema rather than restated, the way
# `packages/configs/src/graphql/schema/*.graphql` take theirs. A scalar the ODB
# renames or reshapes therefore breaks this file instead of quietly diverging
# from the payload the Scala service will send.
#
# The `#import` at the top of this file is not GraphQL - it is
# @graphql-tools/import, which inlines the named types and whatever they depend
# on (about 2kB of the ODB's 500kB). Codegen and @graphql-eslint each resolve it
# through their own loader; nothing resolves it at runtime. Codegen writes its
# expansion back out as `src/gql/gen/schema.graphql`, and that generated file
# is the SDL all four consumers read - the :4000 server, the resolver tests, the
# cache test and the browser-test Apollo client - so none of them can build a
# schema the client types were not generated from. It is only as fresh as the
# last `codegen` run.
#
# Imported: BigDecimal, Date, Long, NonEmptyString, Partner, PosInt,
# ProgramReferenceLabel, Semester, Site, TimeSpan, Timestamp,
# TimestampInterval.
#
# `Instrument` is deliberately *not* imported: the schedules mount things the
# ODB's enum does not name, and reconciling the two is open with operations.
# ---------------------------------------------------------------------------

"""
The single operational-state value for anything the observatory can use.

One enum rather than a separate availability flag and usage field: an instrument
can be mounted on the telescope and still not usable for science, and separate
fields would permit meaningless combinations like "unavailable but usable".
"""
enum ResourceUsage {
  "Available for science observations."
  SCIENCE
  "Available, but committed to engineering or commissioning."
  ENGINEERING
  "Not available."
  UNAVAILABLE
}

"Whether the telescope itself is open. Only the telescope is OPEN/CLOSED."
enum TelescopeAvailability {
  OPEN
  CLOSED
}

"""
The level of Target of Opportunity interruption the telescope supports.

`NONE` means no ToOs of any kind - a recorded fact, not an absence. A span with
no record at all means "not recorded", as everywhere in this API.
"""
enum TooSupport {
  STANDARD
  INTERRUPT
  RAPID
  NONE
}

"""
How the telescope is being operated over a span.

`TelescopeMode`, not "observing mode": GPP already uses `ObservingModeType` for
instrument configurations.
"""
enum TelescopeModeType {
  QUEUE
  CLASSICAL
  PRIORITY_VISITOR
  ENGINEERING
  COMMISSIONING
  """
  Recorded when operations schedule a shutdown as a mode. The workbook data
  carries none - a shutdown night's mode is simply unrecorded there - but the
  requirement names it and entered data may carry it.
  """
  SHUTDOWN
  "A span scheduled as a block for one partner; `partner` names which."
  BLOCK_SCHEDULING
}

"""
A telescope subsystem the schedule can state operational facts about - the
requirement's example set. ALTAIR and CANOPUS also appear in `Instrument`,
where the schedules mount them; which home they keep is open with operations.
"""
enum TelescopeSubsystem {
  PWFS1
  PWFS2
  ALTAIR
  CANOPUS
  LGS
  GPOL
  DOME_SHUTTER
  DOME_VENT_GATES
}

"What powers a subsystem over a span, where operations record it."
enum PowerSource {
  COMMERCIAL
  GENERATOR
}

"""
Where an instrument physically is.

Total, so one field answers "where is this" for an instrument on the telescope
and one on a shelf alike: `PORT` is the telescope itself, and the other four are
where an instrument sits when it is off it.

`UNKNOWN` is a recorded fact and not an error: the schedules mark an instrument
usable between mounts without ever saying where it was sitting.
"""
enum InstrumentPlace {
  PORT
  FLOOR
  LAB
  BASE
  UNKNOWN
}

"""
An interval of instants to ask about, `start` inclusive and `end` exclusive -
the input side of the ODB's `TimestampInterval`.

Half-open is what makes adjacent records abut exactly: one record's `end` is the
next one's `start`, with no gap and no overlap at the boundary. It is also what
lets a fact cover part of a night with no special case.
"""
input TimestampIntervalInput {
  start: Timestamp!
  end: Timestamp!
}

"A range of observing nights, `start` inclusive and `end` exclusive."
type DateInterval {
  "The first observing night in the range, by the date the night ends."
  start: Date!
  "The night *after* the last one in the range. Exclusive, like every interval here."
  end: Date!
}

"""
A range of observing nights to ask about, `start` inclusive and `end` exclusive.

Same reading as `DateInterval`, which is what every night range in a response
carries, so a range that comes out of this API goes straight back into it.
"""
input DateIntervalInput {
  start: Date!
  end: Date!
}

"""
Where an instrument is over a span, and the only thing that says which row a
schedule view files a record under: the schedule views are the ports' picture,
so a record whose `place` is `PORT` draws on that port's row and every other
place draws nowhere.

One type with a total `place`, rather than a `PortLocation | OffPortLocation`
union (2026-08-17, reversing the union of 2026-08-14). `place` is the
discriminator and it always has an answer, so one query says where everything is
and a client reads a field instead of writing two inline fragments.

**The pairing is a server guarantee rather than a schema constraint**, which is
what the flat shape costs: `port` is non-null exactly when `place` is `PORT`,
and is **explicitly `null`** - not merely absent - at every other place. Build
the value in one place on the server and re-check it in one place on the client;
two call sites constructing it is how the pairing drifts.
"""
type InstrumentLocation {
  place: InstrumentPlace!
  """
  The telescope port, non-null exactly when `place` is `PORT`.

  Explicitly `null` otherwise - a record off a port carries the field with a
  null value, never omits it.
  """
  port: PosInt
}

"""
Fields every interval record carries.

**No `id`, deliberately.** Every query clips its records to the interval that
was asked for, so two responses can carry the same underlying record with
different intervals. An `id` on that is not an identity - a client that
normalized by it would let one window's answer overwrite another's, which is
exactly the bug this frontend shipped and then had to disable id-normalization
to fix. Nothing about a block is addressable on its own; a client that needs a
key for a rendered row makes one from the response it drew.
`InstrumentComponent` keeps its `id`, because a piece of hardware *is* an
entity - identity only, no window-dependent fields.
"""
interface ScheduleBlock {
  site: Site!
  interval: TimestampInterval!
  "Free text as published, e.g. \"Engineering Shutdown\". Never parsed for meaning."
  note: NonEmptyString
}

"""
Everything the published schedules name as occupying a port or being usable.

Resource models all of these as instruments, which is what the schedules do. Some
are not instruments in the lucuma-core sense - ALTAIR and CANOPUS are AO
subsystems, ENGINEERING is an operational state, CAL_ZORRO names two things - and
mapping them onto lucuma-core is deferred, still open with operations.
"""
enum Instrument {
  "The facility acquisition camera. Each telescope has one; they share a tag."
  ACQ_CAM
  ALOPEKE
  "AO facility at Gemini North."
  ALTAIR
  """
  The ZORRO speckle imager. The tag keeps the published sheets' joint
  "Cal/ZORRO" spelling; the operations workbook records the calibration unit
  separately as GCAL, which ZORRO displaces on Port 2 for visitor runs.
  """
  CAL_ZORRO
  "GeMS AO facility at Gemini South."
  CANOPUS
  "Published beside the instruments in the North colour key."
  ENGINEERING
  F2
  "The facility calibration unit, on Port 2 at both sites most nights."
  GCAL
  GHOST
  GMOS
  GNIRS
  "The Gemini Planet Imager."
  GPI
  GSAOI
  IGRINS2
  IQUEYE
  MAROON_X
  "Near-InfraRed Imager and spectrograph, Gemini North."
  NIRI
  SCORPIO
  """
  A run the schedule names but the observatory's instrument list does not.
  Served so every recorded run is drawn rather than silently missing; `note`
  keeps the text the source carried. Identifying these is an open question with
  operations, not an error.
  """
  UNKNOWN
}

"An instrument's operational state over an interval, and where it was."
type InstrumentAvailabilityBlock implements ScheduleBlock {
  site: Site!
  interval: TimestampInterval!
  note: NonEmptyString
  instrument: Instrument!
  "The name exactly as the schedule prints it, e.g. \"cal/ZORRO\", \"Maroon-X Run\"."
  publishedName: String!
  location: InstrumentLocation!
  usage: ResourceUsage!
}

"""
Planned telescope availability over an interval, with a free-text reason.

The workbook's Telescope column states Open and Closed alike, at both sites,
so an open night is a recorded fact and a gap in this API still means "not
recorded", never "closed". A closure carries its reason when the schedule
names one ("Shutdown"); a night closed under an operating mode - weather,
under "Queue" - carries none.
"""
type TelescopeAvailabilityBlock implements ScheduleBlock {
  site: Site!
  interval: TimestampInterval!
  note: NonEmptyString
  availability: TelescopeAvailability!
  """
  The port this applies to, or null when it applies to the whole telescope.

  A port shuts down on its own - Gemini South's Port 4 carried nothing for all of
  2026B - so a closure is scoped. When every port is shut at once, a second
  record with `port: null` states that the telescope itself was closed.
  """
  port: PosInt
  "Why, as printed, e.g. \"Telescope Shutdown A&G Maintenance\". Never parsed."
  reason: NonEmptyString
}

"""
The ToO support level over an interval.

Its own record kind, deliberately: ToO support is independent of what is mounted
and of whether the telescope is open, so it never rides on another block. The
workbook's ToOs column is blank on every night of the current export, so the
demo serves the observatory default - Standard support, wearing the assumption
as the record's note; a written level is a fact and supersedes it.
"""
type TooSupportBlock implements ScheduleBlock {
  site: Site!
  interval: TimestampInterval!
  note: NonEmptyString
  tooSupport: TooSupport!
}

"""
The telescope's operating mode over an interval.

Independent of the mounted instruments for the same reason ToO support is: a
classical run or an engineering night is a fact about the telescope, not about
a port. The published sheets do not carry it; the source is operations entry.
"""
type TelescopeModeBlock implements ScheduleBlock {
  site: Site!
  interval: TimestampInterval!
  note: NonEmptyString
  mode: TelescopeModeType!
  "The programs a CLASSICAL or PRIORITY_VISITOR span is for, when any are named."
  programReferences: [ProgramReferenceLabel!]!
  "The partner a BLOCK_SCHEDULING span belongs to. Non-null exactly then."
  partner: Partner
}

"""
One observing night, with every record that touches it clipped to it.

An observing night is the lucuma-core `LocalObservingNight` interval: 14:00 local
on the previous day to 14:00 local on the labelling day. A schedule column headed
"7" is the night that begins the evening of the 7th, so it is the night labelled
by the 8th.

Partial nights are first class. A mid-night change arrives as two blocks with a
boundary between them, never flattened to one value for the night.
"""
type TelescopeNight {
  site: Site!
  "The date the night ends, which is the date it is labelled by."
  observingNight: Date!
  interval: TimestampInterval!
  """
  False when nothing has been recorded for this night.

  This is what keeps "no schedule entered yet" distinguishable from "nothing is
  available". A consumer must never read empty lists as a closed telescope.
  """
  dataAvailable: Boolean!
  instrumentAvailability: [InstrumentAvailabilityBlock!]!
  telescopeAvailability: [TelescopeAvailabilityBlock!]!
  tooSupport: [TooSupportBlock!]!
  telescopeMode: [TelescopeModeBlock!]!
  subsystems: [TelescopeSubsystemAvailabilityBlock!]!
  "Component identity for observation matching - the scheduler contract keeps it in the night."
  components: [InstrumentComponentAvailabilityBlock!]!
}

"A semester whose schedule Resource holds, for a site + semester picker."
type PublishedSemester {
  site: Site!
  semester: Semester!
  "The sheet's own heading, e.g. \"Gemini South Semester 2026B\"."
  title: String!
  "The sheet's own version stamp, e.g. \"Jun 15, 2026\". Null when it carries none."
  version: NonEmptyString
  """
  True for a synthetic schedule that was never published. The workbook import
  serves none today; the flag stays because a consumer must be able to keep
  invented records apart from the published ones, and a picker must say which
  is which.
  """
  demo: Boolean!
  """
  The semester's observing nights, half-open like every other interval here.

  Not a `firstNight`/`lastNight` pair, which is what this carried until
  2026-08-14: a *last* night is inclusive while `DateIntervalInput.end` is
  exclusive, so `telescopeNights({ start: firstNight, end: lastNight })` came
  back one night short and nothing in the response said so. Half-open both
  sides means this value goes straight into `telescopeNights` and covers
  exactly the semester.
  """
  nights: DateInterval!

  """
  Public holidays over the semester, as the sheet marks them.

  Nothing else in the system knows that 18 September is Fiestas Patrias, which
  is why this is imported rather than derived - unlike weekends, which the
  calendar gives for free and are therefore not stored.

  Empty at Gemini North, which publishes no day-header colouring at all. That is
  a site convention, not missing data.
  """
  holidays: [Date!]!

  """
  The new and full moon dates the sheet prints down its left column.

  Published values rather than computed ones, so they are what science
  operations actually read. They do contain occasional typos, which are served
  as printed rather than corrected - the sheet is the record.
  """
  moonEvents: [MoonEvent!]!
}

"A new or full moon, as printed on the published sheet."
type MoonEvent {
  date: Date!
  phase: MoonPhase!
}

enum MoonPhase {
  NEW
  FULL
}

enum InstrumentComponentType {
  FILTER
  DISPERSER
  FPU
  WFS
  OTHER
}

"""
Soft-delete state for a scientist-managed record. A DELETED piece stops being
offered but its historical availability blocks stay valid - retiring a
component must never invalidate the records that name it.
"""
enum Existence {
  PRESENT
  DELETED
}

"""
Where a piece is when it is not installed in its instrument.

Deliberately not `InstrumentLocation`: a component saying PORT 3 while its
instrument says LAB would be a contradiction the schema permitted. INSTALLED
means "wherever its instrument is", resolved by joining the instrument's own
records, so the two cannot disagree by construction. That reasoning got stronger
when `InstrumentLocation` flattened into one type: it now carries `PORT` as an
ordinary `place`, so sharing it here would make the contradiction easier to
express, not harder.
"""
enum ComponentLocation {
  INSTALLED
  FLOOR
  LAB
  BASE
  UNKNOWN
}

"""
An instrument piece, per v1-domain-model.md §5.2: `code` is the lucuma-core enum
tag where one exists; a MOS mask has no enum value, so its barcode doubles as
its code; aliases are legacy names resolved within the owning instrument.

Identity carries no site - where a piece is, and when, is time-bounded data on
its availability blocks.
"""
type InstrumentComponent {
  id: ID!
  instrument: Instrument!
  componentType: InstrumentComponentType!
  "Canonical code, unique per (instrument, componentType)."
  code: NonEmptyString!
  name: NonEmptyString!
  "Mask barcode when applicable, e.g. \"11002801\"."
  barcode: NonEmptyString
  aliases: [NonEmptyString!]!
  existence: Existence!
}

"A span of a component's life: where it was and whether it was usable."
type InstrumentComponentAvailabilityBlock implements ScheduleBlock {
  site: Site!
  interval: TimestampInterval!
  note: NonEmptyString
  component: InstrumentComponent!
  usage: ResourceUsage!
  location: ComponentLocation!
}

"""
A telescope subsystem's operational state over an interval.

The workbook records PWFS1, PWFS2 and the LGS nightly; the other subsystems
await entered data. LGS availability is this block on the LGS subsystem - a
laser run can cover part of a night like any other interval fact.
"""
type TelescopeSubsystemAvailabilityBlock implements ScheduleBlock {
  site: Site!
  interval: TimestampInterval!
  note: NonEmptyString
  subsystem: TelescopeSubsystem!
  usage: ResourceUsage!
  "Recorded when operations state it; the workbook carries none."
  powerSource: PowerSource
}

type Query {
  "Every site + semester Resource holds, for the picker."
  publishedSemesters: [PublishedSemester!]!

  "One observing night. Never null - an un-entered night has `dataAvailable: false`."
  telescopeNight(site: Site!, observingNight: Date!): TelescopeNight!

  """
  A range of observing nights - one night for real-time use, up to a semester for
  planning. This is the scheduler's only query.

  Bounded to 400 nights: above a semester, below an accidental decade.
  """
  telescopeNights(site: Site!, nights: DateIntervalInput!): [TelescopeNight!]!

  """
  Instrument records intersecting an interval, for the semester and week views.

  `clip: false` returns each record's stored interval, so a view can draw a
  mounting that runs past the edge of what it asked for. `clip: true` trims them
  to the requested interval. The night projection always clips - that is its
  contract.

  Unpaged: the views display a whole semester at once, so a semester comes back
  in one response.
  """
  instrumentAvailability(
    site: Site!
    interval: TimestampIntervalInput!
    clip: Boolean! = false
  ): [InstrumentAvailabilityBlock!]!

  """
  Telescope and port closures intersecting an interval - the other half of what a
  semester view draws. Same clipping contract as `instrumentAvailability`.
  """
  telescopeAvailability(
    site: Site!
    interval: TimestampIntervalInput!
    clip: Boolean! = false
  ): [TelescopeAvailabilityBlock!]!

  "ToO support records intersecting an interval. Same clipping contract."
  tooSupport(site: Site!, interval: TimestampIntervalInput!, clip: Boolean! = false): [TooSupportBlock!]!

  "Telescope mode records intersecting an interval. Same clipping contract."
  telescopeMode(site: Site!, interval: TimestampIntervalInput!, clip: Boolean! = false): [TelescopeModeBlock!]!

  "Subsystem records intersecting an interval. Same clipping contract."
  telescopeSubsystemAvailability(
    site: Site!
    interval: TimestampIntervalInput!
    clip: Boolean! = false
    subsystems: [TelescopeSubsystem!]
  ): [TelescopeSubsystemAvailabilityBlock!]!

  """
  The component catalog a site's records cover - the identity half of the
  component browser. Unpaged for the same reason every other list is: the
  browser displays all of it, and a site's working set is under a hundred pieces.

  `search` matches name, code, barcode and alias, case-insensitively. The exact
  code/barcode resolution the ODB check needs is the backend's concern and is
  not reproduced here.
  """
  components(
    site: Site!
    instruments: [Instrument!]
    componentTypes: [InstrumentComponentType!]
    search: NonEmptyString
    "Soft-deleted pieces are excluded unless asked for, the ODB convention."
    includeDeleted: Boolean! = false
  ): [InstrumentComponent!]!

  """
  Component records intersecting an interval - the state half of the browser,
  under the same clipping contract as `instrumentAvailability` (I6), with the
  same reading of absence: a span with no record is "not recorded", never
  "unavailable" (I4).
  """
  instrumentComponentAvailability(
    site: Site!
    interval: TimestampIntervalInput!
    clip: Boolean! = false
    instruments: [Instrument!]
    componentTypes: [InstrumentComponentType!]
  ): [InstrumentComponentAvailabilityBlock!]!
}
